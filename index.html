<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fund Status Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
<style>
  body {
    font-family: "Newsreader", serif;
  }
</style>
</head>

<body class="bg-emerald-100 min-h-screen">

<div class="max-w-4xl mx-auto p-4">

  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-emerald-800">Staff Club Fund KV3</h1>
    <p class="text-sm text-emerald-500">Complete transaction history</p>
  </div>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">

    <div class="bg-white rounded-xl shadow p-4 text-center">
      <p class="text-sm text-emerald-500">Total Credit</p>
      <p id="totalCredit" class="text-xl font-semibold text-green-600">₹0</p>
    </div>

    <div class="bg-white rounded-xl shadow p-4 text-center">
      <p class="text-sm text-emerald-500">Total Debit</p>
      <p id="totalDebit" class="text-xl font-semibold text-red-500">₹0</p>
    </div>

    <div class="bg-white rounded-xl shadow p-4 text-center">
      <p class="text-sm text-emerald-500">Net Fund Balance</p>
      <p id="netBalance" class="text-xl font-semibold text-blue-600">₹0</p>
    </div>

  </div>

  <!-- Transactions Table -->
  <div class="bg-white rounded-xl shadow overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-emerald-50 text-emerald-600 uppercase text-xs">
        <tr>
          <th class="px-4 py-3 text-left">Date</th>
          <th class="px-4 py-3 text-left">Name</th>
          <th class="px-4 py-3 text-left">Type</th>
          <th class="px-4 py-3 text-right">Amount (₹)</th>
        </tr>
      </thead>
      <tbody id="rows" class="divide-y">
        <tr>
          <td colspan="4" class="px-4 py-4 text-center text-emerald-400">
            Loading transactions…
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
/* =======================
   CONFIG
======================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwwKGXHEat67cSTjRUaaCjTHuawNX6xqxt3_Y4WmRmdggUQp_5Wm_3LlyztFTLC3zzF/exec"; // replace this

/* =======================
   HELPERS
======================= */
function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString("en-GB", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

/* =======================
   FETCH & RENDER
======================= */
fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    let credit = 0;
    let debit = 0;

    data.transactions.forEach(t => {
      const amt = Number(t.amount) || 0;
      if (t.type === "Credit") credit += amt;
      if (t.type === "Debit") debit += amt;
    });

    const sorted = data.transactions.sort(
      (a, b) => new Date(b.date) - new Date(a.date)
    );

    const rowsHtml = sorted.map(t => `
      <tr>
        <td class="px-4 py-3">${formatDate(t.date)}</td>
        <td class="px-4 py-3">${t.name}</td>
        <td class="px-4 py-3">
          <span class="px-2 py-1 rounded text-xs font-medium
            ${t.type === "Credit"
              ? "bg-green-100 text-green-700"
              : "bg-red-100 text-red-700"}">
            ${t.type}
          </span>
        </td>
        <td class="px-4 py-3 text-right font-medium">₹${t.amount}</td>
      </tr>
    `).join("");

    document.getElementById("rows").innerHTML =
      rowsHtml || `
        <tr>
          <td colspan="4" class="px-4 py-4 text-center text-emerald-400">
            No transactions found
          </td>
        </tr>
      `;

    document.getElementById("totalCredit").innerText = `₹${credit}`;
    document.getElementById("totalDebit").innerText = `₹${debit}`;
    document.getElementById("netBalance").innerText = `₹${credit - debit}`;
  })
  .catch(() => {
    document.getElementById("rows").innerHTML = `
      <tr>
        <td colspan="4" class="px-4 py-4 text-center text-red-500">
          Failed to load data
        </td>
      </tr>
    `;
  });
</script>

</body>
</html>
